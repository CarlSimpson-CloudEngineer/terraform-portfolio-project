name: Smoke test

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  AWS_REGION: eu-west-2
  BUCKET: nextjs-site-s3

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Smoke test the live site
        run: |
          set -euo pipefail
          SITE="https://${{ vars.CLOUDFRONT_DOMAIN }}/"
          S3="https://${{ env.BUCKET }}.s3.${{ env.AWS_REGION }}.amazonaws.com/index.html"

          headers=$(curl -sSI "$SITE") || { echo "Could not reach $SITE"; exit 1; }
          grep -q " 200" <<< "$(head -n 1 <<< "$headers")" || { echo "CloudFront did not return 200"; exit 1; }
          for h in strict-transport-security x-frame-options x-content-type-options referrer-policy x-xss-protection; do
            grep -qi "^$h:" <<< "$headers" || { echo "Missing header: $h"; exit 1; }
          done

          code=$(curl -s -o /dev/null -w "%{http_code}" "$S3")
          [ "$code" = "403" ] || { echo "Direct S3 returned $code, expected 403"; exit 1; }
          echo "Smoke test passed"