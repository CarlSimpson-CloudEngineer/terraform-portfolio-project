name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "nextjs-blog/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2
  BUCKET: nextjs-site-s3

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs-blog
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nextjs-blog/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build the site (first gate)
        run: npm run build

      - name: Get temporary AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload site to S3
        run: aws s3 sync out s3://${{ env.BUCKET }} --delete

      - name: Clear the CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"

      - name: Smoke test the live site
        run: |
          set -euo pipefail
          SITE="https://${{ vars.CLOUDFRONT_DOMAIN }}/"
          S3="https://${{ env.BUCKET }}.s3.${{ env.AWS_REGION }}.amazonaws.com/index.html"

          headers=$(curl -sSI "$SITE") || { echo "Could not reach $SITE"; exit 1; }
          grep -q " 200" <<< "$(head -n 1 <<< "$headers")" || { echo "CloudFront did not return 200"; exit 1; }
          for h in strict-transport-security x-frame-options x-content-type-options referrer-policy x-xss-protection; do
            grep -qi "^$h:" <<< "$headers" || { echo "Missing header: $h"; exit 1; }
          done

          code=$(curl -s -o /dev/null -w "%{http_code}" "$S3")
          [ "$code" = "403" ] || { echo "Direct S3 returned $code, expected 403"; exit 1; }
          echo "Smoke test passed"